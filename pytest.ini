[pytest]
# tests/api is excluded here and that exclusion is DELIBERATE, not neglect:
# these tests build a real session and universe, which mutates module-level
# item and merchant registries and pollutes downstream shop/spawn tests. It
# is not unrun -- it has its own CI job, one pytest process per file, in
# .github/workflows/api-tests.yml, which carries the reasons for both the
# exclusion and the per-file isolation. Excluding it WITHOUT that pointer is
# how it went uncovered before #522.
#
# This branch removed the exclusion and put the directory in the walked gate,
# on the premise that an excluded directory rots. The premise was true of the
# contents (501 tests, 123 blanket-skipped by their own authors, 61 failing on
# drift, one hanging the collector) and false of the exclusion itself, which
# exists for registry isolation. The 27 modules that had rotted are still
# deleted -- measured at 12 statements of unique coverage, six of which are
# now covered by tests written into tests/ proper -- and the exclusion is
# restored, so the survivors run per-file in CI rather than polluting the
# default suite. Passing today in one process is not the same as being order
# independent, which is the guarantee the per-file job actually provides.
#
# The one criterion that rescue missed, kept here because it is orthogonal to
# all of the above: tests/api/test_cloud_integration.py earns its coverage by
# registering a REAL user against the database TURSO_DATABASE_URL names. No
# test may perform a real network, database or third-party API write. Anything
# that must is gated on its own opt-in env var (HOV_LIVE_LLM, HOV_LIVE_DB),
# and tests/conftest.py blanks the credential besides, so a missed gate fails
# loudly rather than succeeding against production.
norecursedirs = tests/api tests/broken tests/uat tests/integration .claude

# testpaths: pytest otherwise walks the whole repo root (frontend/node_modules,
# docs/, .git/, tools/) hunting for test files. Restricting the walk to tests/
# cuts collection from ~6.2s to ~3.3s for a byte-identical collected set (8886
# either way) -- and every xdist worker pays collection, so it is that saving
# times N.
#
# It also structurally closes the stray-script hazard CLAUDE.md documents: a
# rootdir `test_*_fix.py` doing `sys.modules['flask'] = MagicMock()` at import
# is now simply never collected. The seven --ignore-glob entries that used to
# sit below were never a guard against that -- pytest's python_files default is
# `test_*.py *_test.py`, which none of debug_*/check_*/find_*/reproduce_*/
# verify_*/uat_*/manual_* ever matched. Verified by diffing --collect-only with
# and without them: identical. The 16 files they named are now deleted.
#
# -n auto --dist loadfile: ~8.6k tests took ~71s serially; spreading them over
# the available cores brings it to ~37s. `loadfile` keeps every test in a file
# on one worker, preserving the intra-file ordering that tests building a real
# session/universe depend on (doing so mutates module-level item and merchant
# registries -- see CLAUDE.md). Use `-n0` to disable for interactive debugging.
testpaths = tests
addopts = -n auto --dist loadfile
