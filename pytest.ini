[pytest]
norecursedirs = tests/api tests/broken tests/uat tests/integration .claude

# The six --ignore=tests/... entries that used to sit here are gone: all six
# files now run. Three (llm_openrouter, combat_strategist,
# combat_adapter_strategist) passed untouched and had simply been switched off;
# the other three needed real fixes -- see the tests themselves.
#
# -n auto --dist loadfile: the suite is ~8k tests and was ~71s serially; running
# it across the available cores brings it to ~33s. `loadfile` keeps every test in
# a file on one worker, which preserves the intra-file ordering that tests
# building a real session/universe rely on (doing so mutates module-level item and
# merchant registries -- see CLAUDE.md). Verified green over repeated randomised
# runs. Use `-n0` to disable for interactive debugging of a single test.
addopts =
    -n auto --dist loadfile
    --ignore-glob=**/debug_*.py
    --ignore-glob=**/check_*.py
    --ignore-glob=**/find_*.py
    --ignore-glob=**/reproduce_*.py
    --ignore-glob=**/verify_*.py
    --ignore-glob=**/uat_*.py
    --ignore-glob=**/manual_*.py
