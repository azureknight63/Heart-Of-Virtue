# Continuous Integration — runs on every push and PR
# Ensures tests and linting pass before code lands on master.

name: CI

on:
  push:
    branches: [master, web-api]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (pytest + lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q -n auto
        env:
          MYNX_LLM_ENABLED: "0"
          MYNX_LLM_PROVIDER: "none"

      # pytest.ini sets `testpaths = tests` and `norecursedirs = ... .claude`, so the
      # default suite never walks the skill rules modules. They are tested code
      # (code_review_rules, code_scrubber_rules, patch_validation) and without this
      # step their tests pass only when someone runs them by hand -- a guard that
      # has already gone quiet. Explicit path beats norecursedirs. Use -n0 rather
      # than -p no:xdist: pytest.ini's addopts still passes `-n auto --dist
      # loadfile`, and disabling the plugin leaves those unparsed, which fails the
      # step. -n0 keeps xdist loaded and simply runs serially (CLAUDE.md's own
      # recommendation) for what is a sub-second suite.
      - name: Run skill rules tests
        run: python -m pytest .claude/skills/_shared/review_rules/ -q -n0

      - name: Lint (flake8)
        run: flake8 --extend-ignore=E501 src/

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run tests
        run: cd frontend && npm test -- --run
