[game]
# Grondia Arc Beta Test Configuration
# Arc scope: Grondia entrance -> river crossing with Mara (Eastern Descent)
#
# Corrected per issue #547 (found during the 2026-09-06 live beta QA pass --
# the version this replaces could not actually drive the beta it was written
# for). Fixes, relative to the original:
#   skipdialog = False        -- was True, which skips every story scene
#                                (MaraFirstContactEvent, GorranGestureEvent,
#                                 etc.) that this beta exists to test.
#   starting_party_members    -- Gorran joined in ch01 and Scenes 4-6 (the
#                                 gate farewell, Mara appraising him) assume
#                                 he is present; the original predates this key.
#   starting_equipment        -- worn gear (a ch01 save would have it worn),
#                                 not starting_items, which spawns weapon/
#                                 armor on the floor of (1,2) instead.
#   starting_exp removed      -- 8000 exp opens the session on a blocking
#                                 LEVEL UP modal with 64-71 unspent points,
#                                 and the resulting level-10 loadout
#                                 trivialised the route (King Slime died in
#                                 one 72-damage hit in the QA run). At the
#                                 time there was no config option to
#                                 pre-allocate stat points, so the only way
#                                 to avoid the blocking modal was to not grant
#                                 exp that crosses a level boundary -- start
#                                 at level 1 instead -- and the follow-up for
#                                 an engine-side "pre-allocated starting
#                                 level" option was filed as issue #581.
#   starting_level = 3        -- that option now exists (#581). The level-1
#                                 start made the first authored Mineral Pools
#                                 fight unwinnable, so the beta opens at level
#                                 3: Player.apply_starting_level climbs through
#                                 the real level-up loop (random 0-2 stat
#                                 bonuses per level, as in play) and then
#                                 spends every attribute point itself, so no
#                                 LEVEL UP modal is pending at session start
#                                 and Gorran level-syncs to 3 on join. Points
#                                 are spent with the `even` policy (round-robin
#                                 across the seven level-up attributes in
#                                 engine order); starting_level_allocation
#                                 names the policy so a combat-heavy spread
#                                 can be added engine-side later without
#                                 touching this file.
testmode = True
skipdialog = False
skipintro = True

# Start at Grondia passage tile (1,2) -- the BetaTesterBriefing trigger tile
startmap = grondia
startposition = 1, 2

# Carry-over state: Lurker defeated, arrived from Verdette Caverns
starting_story_flags = lurker_defeated
starting_party_members = Gorran

# Pre-allocated level-3 start (#581) -- see the header note. `even` is the
# only allocation policy today; see STARTING_LEVEL_ALLOCATION_POLICIES in
# src/player/_leveling.py for the registry a new policy is added to.
starting_level = 3
starting_level_allocation = even

# Worn loadout (not starting_items, which spawns on the floor instead of equipped)
#
# Syntax: comma-separated `ItemClassName[:enchantment_level]`. The name must be a
# class in src.items (the class name, NOT the display name -- `RustedIronMace`,
# not "Rusted Iron Mace"); the `:N` suffix is the enchantment level passed to the
# constructor, and a missing suffix means 0. Parsed by
# SessionManager._load_starting_equipment_from_config / _apply_starting_equipment
# (src/api/services/session_manager.py). Every spec is added to the inventory and
# auto-equipped; for a non-Accessory slot the last spec of that maintype wins, so
# **the last weapon listed is the one Jean has drawn.**
#
# RustedIronMace is listed after Shortsword deliberately, per issue #562/#551. The
# route's first three enemy types all resist slashing and are *vulnerable* to
# crushing, and the canonical damage line
# (src/moves/_base.py resolve_damage) subtracts protection AFTER the resistance
# multiplier, so halved slashing minus a high protection floors at zero:
#
#   weapon           dtype     power   RockRumbler   StoneCreature   KingSlime
#                                      p28 sl .5     p18 sl .4       p15 sl .65
#                                          cr 1.5        cr 1.6          cr 1.2
#   Shortsword       slashing  51.25   0 (!)         2-3 (30 hits)   14-21
#   RustedIronMace   crushing  45.0    31-47         43-64           31-46
#
# (Table computed at the level-1 start this config used to produce: str 10,
# fin 15, heat 1.0. power = weapon.damage + str*str_mod + fin*fin_mod, per
# Attack.evaluate(). The level-3 start (#581) adds ~2 levels of random 0-2
# bonuses plus an even spread of 12-18 points, so the power figures are a
# few points higher now; the ordering and the slashing-floors-at-zero point
# are unchanged.)
# The Shortsword stays in the pack so the loadout still reads like a real ch01
# save and the player can pick the right tool; the mace is what he is holding.
# It also restores ch03 MaraObservationEvent's `has_mace` branch, which scans the
# inventory for subtype == "Bludgeon".
starting_equipment = Shortsword:0, RustedIronMace:0, LeatherArmor:0, LeatherCap:0, LeatherGloves:0, LeatherBoots:0
starting_items = Restorative, Restorative, Restorative, Antidote
starting_gold = 300

use_colour = True
debug_mode = False
autosave_enabled = False
learn_all_skills = False
