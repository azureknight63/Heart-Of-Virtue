# =============================================================================
# Heart of Virtue — Victory Loot Testing Configuration (issue #610)
# =============================================================================
# Drives the victory_loot harness scenario in the combat-testing arena.
#
# Usage (in-process, no servers or browser needed):
#   CONFIG_FILE=tests/acceptance/victory-loot/config.ini \
#     python tools/bug_hunt.py --scenario victory_loot
#
# Setup this config produces:
#   - Jean spawns in the Proving Grounds (0, 0).
#   - The Fodder Pit (1, 0) provides Slime + CaveBat; the scenario adds two
#     more Slimes and drops every Fodder Pit enemy to 1 HP through the
#     test-only debug endpoints, so the fight is short and at least one drop
#     is all but certain.
# =============================================================================

[game]
testmode            = True
skipdialog          = True
skipintro           = True
startmap            = combat-testing-arena
startposition       = 0, 0
use_colour          = True
enable_animations   = False

learn_all_skills    = False
# Items in Jean's pack at session start. Everything after Shortsword is a twin
# candidate for the identity half of the scenario (issue #621): the Slime's
# level-0 loot table can roll Restorative or Draught, so whichever the pit
# drops, Jean can drop his own of that name on the fight tile and see whether
# collect-loot takes the fight's object or his. Gold and Equipment_* drops
# have no candidate here — Gold cannot be dropped at all, and the equipment
# roll picks a random class — so those runs print that the identity check
# could not be arranged rather than reporting a defect.
starting_items      = Shortsword, Restorative, Draught, SlimeFlask


[player]

hp              = 200
maxhp           = 200

strength        = 35
finesse         = 35
speed           = 15
# Raised because the harness's move picker never Rests: an attack's fatigue
# cost falls as endurance rises (src/moves/_utility.py), so a high endurance
# keeps a long fight from stalling on an empty fatigue pool.
endurance       = 60
charisma        = 10
intelligence    = 10
faith           = 10

level           = 2
exp             = 0

heat            = 1.0


[scenario]

active_scenario = fodder
max_rounds      = 50


[debug]

debug_mode              = True
log_combat_moves        = True
