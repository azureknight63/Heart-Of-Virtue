# =============================================================================
# Heart of Virtue — Chapter 1 Combat Sequence Testing Configuration
# =============================================================================
# Agent-driven testing for the Chapter 1 Rock Rumbler ambush and its
# post-combat event chain (Ch01ChestRumblerBattle -> RockRumbler fight ->
# Ch01PostRumbler -> Ch01PostRumblerRep -> Ch01PostRumbler2 -> Ch01PostRumbler3
# -> AfterTheRumblerFight -> AfterGorranIntro).
#
# CURRENT TARGET: test-chest map, tile (1, 1) "TestChestRoom" — a minimal,
# self-contained single-tile map built specifically for this sequence
# (src/resources/maps/test-chest.json). No exits; dead-end by design.
#
# The Ch01ChestRumblerBattle event only fires once the wooden chest on the
# tile has been opened/looted — walking onto the tile is NOT enough. Use
# INTERACT -> open/loot on the "wooden chest" object first.
#
# Sequence after opening the chest:
#   1. Narrative: Jean finds a Rusted Iron Mace, hears rumbling -> "continue"
#   2. RockRumbler NPC spawns, combat starts (real combat, not scripted)
#   3. Ch01PostRumbler is queued as a combat_effect event — fires mid/post
#      fight via trigger_combat_events (memory flash -> reinforcement spawn
#      -> completion)
#   4. After combat ends: AfterTheRumblerFight / AfterGorranIntro tile events
# =============================================================================

[game]
testmode            = True
skipdialog          = True
skipintro           = True
startmap            = test-chest
startposition       = 1, 1
use_colour          = True
enable_animations   = True

# Chapter 1 grants no skills yet in the real game, but learning everything
# up front removes grind from this being a mechanics/plumbing test rather
# than a balance test.
learn_all_skills    = True

# Shortsword exploits RockRumbler's 0.5x slashing resistance (see
# src/npc/_enemies.py). Restoratives cover the 28-damage NpcAttack hits.
starting_items      = Shortsword, Restorative, Restorative


# =============================================================================
# [player]  — Jean's starting state when the map loads
# =============================================================================
# RockRumbler: 48 HP, 28 damage, 28 protection, 1.5x crushing / 0.5x
# earth+fire+piercing+slashing resistance. Flavor text calls it "highly
# resistant to most weapons" — narratively Jean is meant to be underpowered
# here, but this config keeps enough HP/damage to run the fight to
# completion repeatedly without grinding, since the point is exercising the
# event chain and SocketIO combat streaming, not balance-testing chapter 1.
# =============================================================================
[player]

hp              = 150
maxhp           = 150

strength        = 25
finesse         = 25
speed            = 12
endurance       = 10
charisma        = 10
intelligence    = 10
faith           = 10

level           = 3
exp             = 0

heat            = 1.0


# =============================================================================
# [scenario]  — not used for test-chest (single-tile map, no arena navigation)
# =============================================================================
[scenario]

active_scenario = custom
max_rounds      = 50
spawn_ally      = False
custom_enemies  = RockRumbler


# =============================================================================
# [combat_events]
# =============================================================================
[combat_events]

active_events   =
events_repeat   = False


# =============================================================================
# [debug]  — Logging and diagnostic flags
# =============================================================================
[debug]

debug_mode              = True
debug_positions         = True
debug_damage_calc       = True
debug_accuracy          = True
debug_ai_decisions      = True
debug_npc_positions     = True

log_combat_moves        = True
log_distance_calculations = True
log_npc_decisions       = True
log_file                = ch01_combat_test.log

monitor_bps             = True
log_performance          = True


# =============================================================================
# [arena]  — Grid and positioning settings for the combat coordinate system
# =============================================================================
[arena]

coordinate_grid_size        = 50, 50

validate_grid_bounds        = True
validate_distance_calc      = True
validate_angle_calc         = True
validate_modifier_calc      = True

show_combat_distance        = True
show_unit_positions         = True
show_facing_directions      = True
show_damage_modifiers       = True
show_accuracy_modifiers     = True
show_coordinate_display     = True

standard_player_x           = 25
standard_player_y           = 10
standard_enemy_x            = 25
standard_enemy_y            = 40


# =============================================================================
# [npc_ai]  — NPC AI tuning parameters
# =============================================================================
[npc_ai]

ai_difficulty               = 3
npc_decision_delay          = 0.5
npc_flanking_enabled        = True
npc_flanking_threshold      = 45.0
npc_retreat_health_threshold = 0.3
npc_flanking_distance_range = 20.0 to 40.0
npc_tactical_retreat        = True


# =============================================================================
# [development]
# =============================================================================
[development]

god_mode        = False
skip_combat     = False
enable_hot_reload = False
