[game]
# Production: beta 2 -- the Grondia arc.
#
# Runs from the Grondia entrance, where BetaTesterBriefing sits, to the Ferry
# Landing in the nomad camp, where the demo ends (Passageway.end_demo raises
# the client's BetaEndDialog once Mara's conversation has opened the ferry).
# The server selects this file with CONFIG_FILE=config_prod.ini in its .env;
# see docs/development/deployment.md. tests/test_prod_config.py checks it
# against the maps. Only full-line comments: SessionManager reads the start
# position, items and gold with a configparser that takes no inline comments.
testmode = False
skipdialog = False

# The BetaTesterBriefing tile. Its only exit is south, so the Verdette Caverns
# behind it are out of reach.
startmap = grondia
startposition = 1, 2

# Chapter 1 carried over: the Lurker is dead and Gorran travels with Jean.
starting_story_flags = lurker_defeated
starting_party_members = Gorran

# Level 4 with the points unspent: the climb awards 6-9 per level, and the
# LEVEL UP dialog opens after the briefing for the player to spend them.
# Spending the last one restores health and fatigue, since strength and
# endurance raise their maxima. Gorran level-syncs to 4 on joining.
starting_level = 4
starting_level_allocation = player

# The worn loadout of a finished chapter 1, as config_grondia_beta.ini has it
# (see its notes for why the mace is the weapon in hand).
starting_equipment = Shortsword:0, RustedIronMace:0, LeatherArmor:0, LeatherCap:0, LeatherGloves:0, LeatherBoots:0
starting_items = Restorative, Restorative, Restorative, Antidote
starting_gold = 300

use_colour = True
debug_mode = False
autosave_enabled = True
learn_all_skills = False
